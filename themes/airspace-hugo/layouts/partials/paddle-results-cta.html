{{/* Paddle Results calls to action: the web app first, then the official App
     Store and Google Play badges. Takes a dict with the page's `apps` front
     matter. */}}
{{ $a := .apps }}
<div class="pr-cta">
  <a class="btn-quko pr-cta-web" href="{{ $a.web }}" target="_blank" rel="noopener"><i class="fas fa-globe" aria-hidden="true"></i>{{ $a.web_label }}<i class="fas fa-arrow-right" aria-hidden="true"></i></a>
  <div class="pr-stores" role="group" aria-label="{{ $a.stores_label }}">
    <span class="pr-stores-label">{{ $a.stores_label }}</span>
    <a class="pr-store" href="{{ $a.app_store }}" target="_blank" rel="noopener"><img src="{{ "images/brands/app-store-badge.svg" | relURL }}" alt="{{ $a.app_store_alt }}" width="120" height="40"></a>
    <a class="pr-store" href="{{ $a.google_play }}" target="_blank" rel="noopener"><img src="{{ "images/brands/google-play-badge.png" | relURL }}" alt="{{ $a.google_play_alt }}" width="134" height="40"></a>
  </div>
</div>
